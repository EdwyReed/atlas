[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-engine"
version = "0.4.0.dev6"
description = "Atlas standalone headless corpus and image workflow engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "starlette>=0.48,<2", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3", "Pillow>=11,<13", "qdrant-client>=1.15,<2", "python-socketio[client]>=5.11,<6"]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]

[project.scripts]
atlas = "atlas_engine.server:main"
atlas-engine = "atlas_engine.server:main"
atlas-client = "atlas_engine.client:main"
atlas-state = "atlas_engine.state_backup:main"
atlas-migrate = "atlas_engine.migrate:main"
atlas-delta-import = "atlas_engine.delta_import:main"
atlas-legacy-import = "atlas_engine.legacy_import:main"

[tool.setuptools]
packages = ["atlas_engine"]
